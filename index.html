    <meta property="og:title" content="ذاكر بذكاء - المساعد التعليمي الذكي" />
    <meta property="og:description" content="منصة تعليمية متكاملة للمذاكرة الذكية، تلخيص المواد الدراسية، قراءة ملفات PDF، إنشاء الاختبارات والبطاقات التعليمية، والخرائط الذهنية باللغة العربية." />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="/pdf.min.js"></script>
    <script>
      (function() {
        function setupWorker() {
          if (window.pdfjsLib) {
            try {
              window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf.worker.min.js';
            } catch (e) {
              console.warn('PDF.js worker setup:', e);
            }
          }
        }
        if (!window.pdfjsLib) {
          var s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          s.onload = setupWorker;
          document.head.appendChild(s);
        } else {
          setupWorker();
        }
      })();
    </script>
    <script>
      // Register Service Worker for Android PWA and offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Zakir PWA ServiceWorker active:', reg.scope))
            .catch(err => console.log('ServiceWorker registration optional notice:', err));
        });
      }
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 font-sans antialiased selection:bg-teal-500 selection:text-white min-h-screen">

  </body>
