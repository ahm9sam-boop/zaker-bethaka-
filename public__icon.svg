<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#091e3a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Glowing Aura for Bulb -->
  <circle cx="256" cy="184" r="70" fill="#38bdf8" opacity="0.18" filter="url(#glow)" />

  <!-- Open Book Base -->
  <g transform="translate(256, 330)">
    <!-- Right Page (RTL primary) -->
    <path d="M 0,10 C 45,-15 110,-15 150,0 L 150,85 C 110,70 45,70 0,95 Z" fill="url(#tealGrad)" opacity="0.95" />
    <!-- Left Page -->
    <path d="M 0,10 C -45,-15 -110,-15 -150,0 L -150,85 C -110,70 -45,70 0,95 Z" fill="#0284c7" opacity="0.85" />
    <!-- Book Spine / Center Binding -->
    <path d="M -6,5 L 0,0 L 6,5 L 6,105 L 0,100 L -6,105 Z" fill="#38bdf8" />
    <!-- Page detail lines -->
    <path d="M 30,25 C 65,12 105,12 130,22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <path d="M 30,45 C 65,32 105,32 130,42" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <path d="M -30,25 C -65,12 -105,12 -130,22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <path d="M -30,45 C -65,32 -105,32 -130,42" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Glowing Lightbulb (Intellect / Education) -->
  <g transform="translate(256, 175)">
    <!-- Rays -->
    <line x1="0" y1="-72" x2="0" y2="-92" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <line x1="50" y1="-50" x2="65" y2="-65" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <line x1="-50" y1="-50" x2="-65" y2="-65" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <line x1="72" y1="0" x2="92" y2="0" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <line x1="-72" y1="0" x2="-92" y2="0" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.9" />

    <!-- Bulb Glass -->
    <path d="M -38,-15 C -38,-38 -20,-56 0,-56 C 20,-56 38,-38 38,-15 C 38,4 24,18 18,32 L -18,32 C -24,18 -38,4 -38,-15 Z" fill="url(#amberGrad)" filter="url(#glow)" />
    <!-- Filament highlight -->
    <path d="M -12,-15 Q 0,-32 12,-15" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="-8" y1="-15" x2="-8" y2="22" stroke="#ffffff" stroke-width="3" opacity="0.7" />
    <line x1="8" y1="-15" x2="8" y2="22" stroke="#ffffff" stroke-width="3" opacity="0.7" />

    <!-- Screw Base -->
    <rect x="-16" y="34" width="32" height="6" rx="3" fill="#cbd5e1" />
    <rect x="-14" y="42" width="28" height="6" rx="3" fill="#94a3b8" />
    <rect x="-10" y="50" width="20" height="5" rx="2" fill="#64748b" />
  </g>

  <!-- Sparkles -->
  <polygon points="120,130 126,144 140,150 126,156 120,170 114,156 100,150 114,144" fill="#2dd4bf" opacity="0.8" />
  <polygon points="380,120 385,132 397,137 385,142 380,154 375,142 363,137 375,132" fill="#38bdf8" opacity="0.8" />
</svg>
